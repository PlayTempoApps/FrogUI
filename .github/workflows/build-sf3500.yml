name: Build FrogUI for SF3500

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mame-game-titles
    paths:
      - 'frogui_libretro.c'
      - '.github/workflows/build-sf3500.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout including dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download SF3000 MIPS toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sf-toolchain"
          curl -fL --retry 3 -o "$RUNNER_TEMP/toolchain.tar.gz" "https://github.com/game-de-it/sf3000/releases/download/sf3000_toolchain_v0.1/mipsel-buildroot-linux-gnu_sdk-buildroot.tar.gz"
          tar -xzf "$RUNNER_TEMP/toolchain.tar.gz" -C "$RUNNER_TEMP/sf-toolchain"
          GCC_PATH=$(find "$RUNNER_TEMP/sf-toolchain" -type f -name 'mips-mti-linux-gnu-gcc' -print -quit)
          SYSROOT_PATH=$(find "$RUNNER_TEMP/sf-toolchain" -type f -path '*/usr/include/linux/fb.h' -print -quit)
          test -n "$GCC_PATH"
          test -n "$SYSROOT_PATH"
          SYSROOT_PATH="${SYSROOT_PATH%/usr/include/linux/fb.h}"
          echo "MIPS=${GCC_PATH%gcc}" >> "$GITHUB_ENV"
          echo "SYSROOT=$SYSROOT_PATH" >> "$GITHUB_ENV"

      - name: Compile FrogUI libretro core
        run: sh ./build_libretro.sh

      - name: Verify binary architecture
        run: |
          file out/frogui_libretro.so
          file out/frogui_libretro.so | grep -Eiq 'ELF.*MIPS'

      - name: Upload compiled core
        uses: actions/upload-artifact@v4
        with:
          name: frogui-mame-titles-sf3500
          path: |
            out/frogui_libretro.so
            out/*.LICENSE
          if-no-files-found: error
